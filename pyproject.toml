[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sundgren"
version = "0.3.0"
description = "Git history as a graph, for the sundgren VS Code extension."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Axel E. Andersson" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["git", "history", "graph", "vscode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/axean/sundgren"
Source = "https://github.com/axean/sundgren"
Issues = "https://github.com/axean/sundgren/issues"
Documentation = "https://axean.github.io/sundgren/"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.22"]
# Docs build needs Python >= 3.12 (Sphinx 9); sundgren itself supports 3.11.
docs = [
    "sphinx>=9.1; python_version >= '3.12'",
    "myst-parser>=5.1; python_version >= '3.12'",
    "shibuya>=2026.7; python_version >= '3.12'",
]

[tool.uv]
default-groups = ["dev", "docs"]
# Rebuild the binary on `uv run`/`uv sync` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

# The wheel holds only the `sundgren` binary.
[tool.maturin]
bindings = "bin"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tests", "tools", "docs/_ext"]
extend-exclude = ["tests/fixtures", "docs/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["tools", "docs/_ext", "docs/conf.py", "tests"]
# The import roots pytest and Sphinx add (pytest pythonpath, docs/conf.py).
extraPaths = ["tests", "tools", "docs/_ext"]
exclude = ["tests/fixtures", "docs/examples", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
addopts = "--import-mode=importlib"
norecursedirs = ["fixtures", ".*", "__pycache__"]
