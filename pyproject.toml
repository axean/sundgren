[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sundgren"
version = "0.2.1"
description = "CLI tool for measuring how code patches affect line coverage."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Axel E. Andersson" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["coverage", "lcov", "patch", "diff", "testing", "pytest", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/axean/sundgren"
Source = "https://github.com/axean/sundgren"
Issues = "https://github.com/axean/sundgren/issues"
Documentation = "https://axean.github.io/sundgren/"

[dependency-groups]
# coverage + pytest here are only for the e2e target project (shed_py), never imported by sundgren.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.22", "coverage>=7.6"]
# Docs build needs Python >= 3.12 (Sphinx 9); sundgren itself supports 3.11.
docs = [
    "sphinx>=9.1; python_version >= '3.12'",
    "myst-parser>=5.1; python_version >= '3.12'",
    "shibuya>=2026.7; python_version >= '3.12'",
]

[tool.uv]
default-groups = ["dev", "docs"]
# Rebuild the binary on `uv run`/`uv sync` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "src/presets/*.toml" },
]

# The wheel holds only the `sundgren` binary.
[tool.maturin]
bindings = "bin"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tests", "tools", "docs/_ext"]
extend-exclude = ["tests/fixtures", "docs/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
addopts = "--import-mode=importlib"
norecursedirs = ["fixtures", ".*", "__pycache__"]
