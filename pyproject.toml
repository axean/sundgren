[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sundgren"
version = "0.1.2"
description = "CLI tool for measuring how code patches affect line coverage."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Axel E. Andersson" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["coverage", "lcov", "patch", "diff", "testing", "pytest", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/axean/sundgren"
Source = "https://github.com/axean/sundgren"
Issues = "https://github.com/axean/sundgren/issues"
Documentation = "https://axean.github.io/sundgren/"

[project.scripts]
sundgren = "sundgren.cli:main"

[dependency-groups]
# coverage + pytest here are only for the e2e target project (shed_py), never imported by sundgren.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.22", "coverage>=7.6"]
# Docs build needs Python >= 3.12 (Sphinx 9); sundgren itself supports 3.11.
docs = [
    "sphinx>=9.1; python_version >= '3.12'",
    "myst-parser>=5.1; python_version >= '3.12'",
    "shibuya>=2026.7; python_version >= '3.12'",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/sundgren"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "docs/_ext"]
extend-exclude = ["tests/fixtures", "docs/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/sundgren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
addopts = "--import-mode=importlib"
norecursedirs = ["fixtures", ".*", "__pycache__"]

# Line coverage of sundgren's own code, measured in-process (subprocess runs of the CLI and of
# Sphinx are not traced). tests/ is excluded; docs/examples holds the sample projects sundgren
# runs, not sundgren's code.
[tool.coverage.run]
source = ["src/sundgren", "tools", "docs", "docs/_ext"]
omit = ["docs/examples/*", "docs/_build/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
