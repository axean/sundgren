[package]
name = "sundgren"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Coverage delta between a base tree and a patched tree"
repository = "https://github.com/axean/sundgren"
include = ["src/**", "schema/**", "LICENSE", "README.md"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1"
roxmltree = "0.21.1"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
shlex = "1.3"
signal-hook = { version = "0.4", default-features = false }
tempfile = "3"
toml = "0.9"
