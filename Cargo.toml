[package]
name = "sundgren"
version = "1.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Git history as a graph, for the sundgren VS Code extension"
repository = "https://github.com/axean/sundgren"
include = ["src/**", "schema/**", "LICENSE", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapidfuzz = "=0.5.0"
