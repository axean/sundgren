[package]
name = "sundgren"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Coverage delta between a base tree and a patched tree"
repository = "https://github.com/axean/sundgren"
include = ["src/**", "schema/**", "LICENSE", "README.md"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
shlex = "1.3"
tempfile = "3"
toml = "0.9"
