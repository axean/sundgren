[package]
name = "sundgren"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "View, understand and measure what git repositories contain, and how they compare: command line and VS Code extension"
repository = "https://github.com/axean/sundgren"
include = ["src/**", "schema/**", "LICENSE", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapidfuzz = "=0.5.0"
