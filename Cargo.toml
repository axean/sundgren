[package]
name = "sundgren"
version = "2.1.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "View, understand and measure what git repositories contain, and how they compare: command line and VS Code extension"
repository = "https://github.com/axean/sundgren"
include = ["src/**", "schema/**", "LICENSE", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapidfuzz = "=0.5.0"
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
