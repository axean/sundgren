[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
sundgren-core = { path = "crates/sundgren-core" }
sundgren-ir = { path = "crates/sundgren-ir" }
sundgren-run = { path = "crates/sundgren-run" }
sundgren-cli = { path = "crates/sundgren-cli" }
