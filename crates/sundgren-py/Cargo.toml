[package]
name = "sundgren-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
sundgren-core.workspace = true
sundgren-run.workspace = true
sundgren-cli.workspace = true
pyo3 = { version = "0.30.1", features = ["abi3-py311", "multiple-pymethods"] }
serde_json = "1"
