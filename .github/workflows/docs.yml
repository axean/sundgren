name: Docs

# Tests and builds the docs site and uploads it as the `docs-site` artifact. It never deploys:
# preview.yml calls it for pull requests, release.yml for the live site. It also runs nightly on
# main, so a broken dependency shows up without a push.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      released:
        description: Build for a release, without the Unreleased changelog section
        type: boolean
        default: false
      pr:
        description: The pull request a preview is for (its banner links to it); 0 for none
        type: number
        default: 0
      main:
        description: Build the preview of main (its banner links the commit)
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"  # Sphinx 9 needs 3.12
      - run: uv sync
      - run: uv run pytest tests/docs -rs

  site:
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - if: inputs.released
        run: uv run tools/release.py strip-unreleased
      - run: uv run sphinx-build -W --keep-going -n -b html -d "$RUNNER_TEMP/doctrees" docs docs/_build/html
        env:
          SUNDGREN_DOCS_RELEASED: ${{ inputs.released }}
          SUNDGREN_DOCS_PR: ${{ inputs.pr }}
          SUNDGREN_DOCS_MAIN: ${{ inputs.main }}
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/_build/html
