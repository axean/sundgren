name: Docs

# Tests and builds the docs site and uploads it as the `github-pages` artifact. It never
# deploys: release.yml calls this before the PyPI publish and deploys the artifact after it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"  # Sphinx 9 needs 3.12
      - run: uv sync
      - run: uv run pytest tests/docs -rs
        env:
          SUNDGREN_DOCS_REQUIRE: python

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      # Pinned: the recorded hit counts depend on rustc and tarpaulin (docs/examples/*/example.toml).
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.37.5
      - run: uv sync
      - run: uv run pytest tests/docs/test_examples.py -rs
        env:
          SUNDGREN_DOCS_REQUIRE: rust

  site:
    needs: [python, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run sphinx-build -W --keep-going -n -b html -d "$RUNNER_TEMP/doctrees" docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
