name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The crate's rust-version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # `uv sync` builds the binary into .venv; pytest runs it on the e2e projects and docs examples.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: uv sync
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/e2e/test_shed_py.py -rs
      - run: uv run pytest tests/docs -rs
        env:
          SUNDGREN_DOCS_REQUIRE: python

  e2e-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # Pinned: the docs example's recording depends on these versions (see its example.toml).
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      - run: uv sync
      - run: uv run pytest tests/e2e/test_shed_rs.py -rs
      - run: uv run pytest tests/docs/test_examples.py -rs
        env:
          SUNDGREN_DOCS_REQUIRE: rust

  # Line coverage of the Rust code: cargo tests plus an instrumented binary run by every pytest.
  # Same Rust pins as e2e-rust, so the Rust example runs too.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      # The tests run the instrumented binary below, not one installed in .venv.
      - run: uv sync --no-install-project
      - run: cargo llvm-cov show-env --sh > llvm-cov.env
      - run: |
          source llvm-cov.env
          cargo build --locked
          cargo test --locked
      # Only the profile path goes to pytest, so the example projects build uninstrumented.
      - run: |
          export LLVM_PROFILE_FILE="$(source llvm-cov.env && echo "$LLVM_PROFILE_FILE")"
          uv run pytest -rs
        env:
          SUNDGREN_BIN: ${{ github.workspace }}/target/debug/sundgren
          SUNDGREN_DOCS_REQUIRE: python,rust
      - run: |
          source llvm-cov.env
          # The unit tests are in tests.rs files, which cargo llvm-cov leaves out of the report.
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          cargo llvm-cov report --html --output-dir htmlcov
          uv run tools/coverage_badge.py coverage.json coverage-badge.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            htmlcov/
            coverage-badge.json

  # Publishes the badge JSON to the `badges` branch, which the README badge reads via shields.io.
  coverage-badge:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - run: |
          mkdir badge && cp coverage-badge.json badge/coverage.json && cd badge
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ github.token }}
