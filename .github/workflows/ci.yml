name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly on main, so a broken toolchain or dependency shows up without a push.
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  # The pre-commit hooks (.pre-commit-config.yaml) on every file: file checks, ruff, pyright,
  # shellcheck, actionlint, cargo fmt and clippy, and the extension's prettier, eslint and tsc.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The extension's hooks run its own eslint, tsc and prettier.
      - run: npm ci --prefix editors/vscode
      - run: uv sync --no-install-project  # the venv pyright resolves imports in; no binary needed
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The crate's rust-version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # `uv sync` builds the binary into .venv; pytest runs it on the e2e projects and docs examples.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: uv sync
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/e2e/test_shed_py.py -rs
      - run: uv run pytest tests/docs -rs
        env:
          SUNDGREN_DOCS_REQUIRE: python

  e2e-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # Pinned: the docs example's recording depends on these versions (see its example.toml).
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      - run: uv sync
      - run: uv run pytest tests/e2e/test_shed_rs.py -rs
      - run: uv run pytest tests/docs/test_examples.py -rs
        env:
          SUNDGREN_DOCS_REQUIRE: rust

  # The VS Code extension (editors/vscode): checks, unit tests, integration tests in a real
  # VS Code (end to end with the sundgren built here and the repo's .venv for pytest), and the
  # .vsix without a bundled binary.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      # The Rust end-to-end case runs cargo llvm-cov.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - run: cargo build --locked
        working-directory: .
      - run: uv sync --no-install-project
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - name: Integration tests on the oldest supported VS Code (engines.vscode)
        run: |
          VSCODE_TEST_VERSION="$(node -p 'require("./package.json").engines.vscode.replace(/^\^/, "")')"
          export VSCODE_TEST_VERSION
          xvfb-run -a npm run test:integration
      - run: npx vsce package --out sundgren.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: editors/vscode/sundgren.vsix

  # The linux-x64 .vsix with a freshly built binary, as release.yml packages it, so packaging is
  # tested before a release.
  vscode-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo build --release --locked
      - run: npm ci
        working-directory: editors/vscode
      - run: scripts/package.sh linux-x64 ../../target/release/sundgren sundgren-linux-x64.vsix
        working-directory: editors/vscode
      - name: Smoke test the bundled binary
        run: |
          unzip -q editors/vscode/sundgren-linux-x64.vsix -d unpacked
          unpacked/extension/bundled/sundgren --version
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-linux-x64
          path: editors/vscode/sundgren-linux-x64.vsix

  # Line coverage of the Rust code: cargo tests plus an instrumented binary run by every pytest.
  # Same Rust pins as e2e-rust, so the Rust example runs too.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      # The tests run the instrumented binary below, not one installed in .venv.
      - run: uv sync --no-install-project
      - run: cargo llvm-cov show-env --sh > llvm-cov.env
      - run: |
          source llvm-cov.env
          cargo build --locked
          cargo test --locked
      # Only the profile path goes to pytest, so the example projects build uninstrumented.
      - run: |
          LLVM_PROFILE_FILE="$(source llvm-cov.env && echo "$LLVM_PROFILE_FILE")"
          export LLVM_PROFILE_FILE
          uv run pytest -rs
        env:
          SUNDGREN_BIN: ${{ github.workspace }}/target/debug/sundgren
          SUNDGREN_DOCS_REQUIRE: python,rust
      - run: |
          source llvm-cov.env
          # The unit tests are in tests.rs files, which cargo llvm-cov leaves out of the report.
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          cargo llvm-cov report --html --output-dir htmlcov
          uv run tools/coverage_badge.py coverage.json coverage-badge.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            htmlcov/
            coverage-badge.json

  # Publishes the badge JSON to the `badges` branch, which the README badge reads via shields.io.
  coverage-badge:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - run: |
          mkdir badge && cp coverage-badge.json badge/coverage.json && cd badge
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ github.token }}
