name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/e2e/test_shed_py.py -rs
      - run: uv run pytest tests/docs -rs
        env:
          SUNDGREN_DOCS_REQUIRE: python

  e2e-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # Pinned: the docs example's recording depends on these versions (see its example.toml).
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      - run: uv sync
      - run: uv run pytest tests/e2e/test_shed_rs.py -rs
      - run: uv run pytest tests/docs/test_examples.py -rs
        env:
          SUNDGREN_DOCS_REQUIRE: rust

  # Line coverage of sundgren's own code (in-process; see [tool.coverage] in pyproject.toml),
  # uploaded to Codecov for the README badge. Same Rust pins as e2e-rust, so the Rust example's
  # code paths in tools/ run too.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload via OIDC, no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-tarpaulin@0.37.5
      - run: uv sync
      - run: uv run coverage run -m pytest -rs
        env:
          SUNDGREN_DOCS_REQUIRE: python,rust
      - run: uv run coverage report
      - run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: |
          uv run coverage xml -q -o coverage.xml
          uv run coverage html -q -d htmlcov
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
