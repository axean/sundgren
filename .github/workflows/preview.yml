name: Docs preview

# Docs with the Unreleased changelog, on the gh-pages branch:
# - each pull request at https://axean.github.io/sundgren/pr-preview/pr-<N>/, removed when it
#   closes;
# - main at https://axean.github.io/sundgren/main/, replaced on every push.
# The live site at the root is updated by releases only.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.number || 'main' }}
  cancel-in-progress: true

jobs:
  # Docs tests and the strict build; uploads the site as the `docs-site` artifact.
  docs:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/docs.yml
    with:
      pr: ${{ github.event.number || 0 }}
      main: ${{ github.event_name == 'push' }}

  publish:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ github.event_name == 'push' && 'docs-main' || 'docs-preview' }}
      url: https://axean.github.io/sundgren/${{ env.DEST }}/
    env:
      DEST: ${{ github.event_name == 'push' && 'main' || format('pr-preview/pr-{0}', github.event.number) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - run: tools/gh-pages.sh gh-pages "$DEST" "$PWD/site"

  remove:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - run: tools/gh-pages.sh gh-pages "pr-preview/pr-${{ github.event.number }}"
