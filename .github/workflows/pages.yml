name: Pages

# Deploys the docs site from main, so it shows unreleased changes too. Releases don't deploy it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Docs tests and the strict build; uploads the Pages artifact.
  docs:
    uses: ./.github/workflows/docs.yml

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
