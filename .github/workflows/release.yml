name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync
      - name: Check tag, version and changelog
        run: uv run tools/release.py check "$GITHUB_REF_NAME"
      - run: uv run tools/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - run: uv run pytest tests/unit
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Wheels holding the `sundgren` binary (py3-none, one per platform), built natively on each
  # runner. Linux builds run in maturin-action's manylinux2014 container.
  wheels:
    needs: check
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      # Smoke test: install the wheel alone and diff two fixtures.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: |
          uv venv -q --python 3.11 smoke
          uv pip install -q --python smoke --no-index --find-links dist sundgren
          smoke/bin/sundgren --version
          run=tests/fixtures/shed_py_runs/skip_divide
          smoke/bin/sundgren diff "$run/base.lcov" "$run/patched.lcov" \
            --patch tests/fixtures/patches/skip_divide.patch --format text
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist/

  # One .vsix per wheel target, with that wheel's binary bundled (Ruff style). vsce packages any
  # target on Linux; package.sh checks the binary's platform and the version.
  vsix:
    needs: wheels
    strategy:
      matrix:
        include:
          - { target: linux-x64, wheels: dist-ubuntu-latest-x86_64 }
          - { target: linux-arm64, wheels: dist-ubuntu-24.04-arm-aarch64 }
          - { target: darwin-x64, wheels: dist-macos-15-intel-x86_64 }
          - { target: darwin-arm64, wheels: dist-macos-latest-aarch64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheels }}
          path: wheels/
      - run: unzip -j wheels/sundgren-*.whl 'sundgren-*.data/scripts/sundgren' -d bin
      - run: npm ci
        working-directory: editors/vscode
      - run: >-
          scripts/package.sh ${{ matrix.target }} ../../bin/sundgren
          "sundgren-${{ matrix.target }}-${GITHUB_REF_NAME#v}.vsix"
        working-directory: editors/vscode
      - if: matrix.target == 'linux-x64'
        name: Smoke test the bundled binary
        run: |
          unzip -q editors/vscode/sundgren-*.vsix -d unpacked
          unpacked/extension/bundled/sundgren --version
      # The release .vsix itself, installed into VS Code, plucks a test with its bundled binary.
      - if: matrix.target == 'linux-x64'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - if: matrix.target == 'linux-x64'
        run: uv sync --no-install-project
      - if: matrix.target == 'linux-x64'
        run: xvfb-run -a npm run test:vsix -- sundgren-linux-x64-*.vsix
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: editors/vscode/sundgren-*.vsix

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  # Docs tests (Python and Rust examples) and the strict build, without the Unreleased changelog
  # section. Publishing waits for it; the `pages` job then makes it the live site.
  docs:
    uses: ./.github/workflows/docs.yml
    with:
      released: true
    permissions:
      contents: read

  # Waits for the .vsix files too, so a packaging failure stops the release before PyPI.
  publish:
    needs: [wheels, sdist, docs, vsix]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sundgren
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # The live docs site: the root of the gh-pages branch. Pull request previews in pr-preview/ stay.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - run: tools/gh-pages.sh gh-pages . "$PWD/site"
