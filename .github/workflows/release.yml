name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync
      - name: Check tag, version and changelog
        run: uv run tools/release.py check "$GITHUB_REF_NAME"
      - run: uv run tools/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - run: uv run pytest tests/unit
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Wheels holding the `sundgren` binary (py3-none, one per platform), built natively on each
  # runner. Linux builds run in maturin-action's manylinux2014 container.
  wheels:
    needs: check
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      # Smoke test: install the wheel alone and diff two fixtures.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: |
          uv venv -q --python 3.11 smoke
          uv pip install -q --python smoke --no-index --find-links dist sundgren
          smoke/bin/sundgren --version
          run=tests/fixtures/shed_py_runs/skip_divide
          smoke/bin/sundgren diff "$run/base.lcov" "$run/patched.lcov" \
            --patch tests/fixtures/patches/skip_divide.patch --format text
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist/

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  # Docs tests (Python and Rust examples) and the strict build; uploads the Pages artifact.
  docs:
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  publish:
    needs: [wheels, sdist, docs]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sundgren
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
