# Run on every commit after `uvx pre-commit install`; CI runs the same hooks on all files.
# Recorded outputs and fixtures are data, byte for byte, and the brand files carry content
# credentials, so no hook touches them.
exclude: ^(tests/fixtures|docs/examples|docs/_static/brand)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # actionlint checks `run:` scripts with shellcheck when it finds one; bring our own so it
        # checks the same everywhere.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy (warnings are errors)
        language: system
        entry: cargo clippy --all-targets --locked -- -D warnings
        types: [rust]
        pass_filenames: false

      - id: mypy
        name: mypy (strict, tools/)
        language: system
        entry: uv run --no-sync mypy
        types: [python]
        pass_filenames: false
