# Run on every commit after `uvx pre-commit install`; CI runs the same hooks on all files.
# Recorded outputs and fixtures are data, byte for byte, and the brand files carry content
# credentials, so no hook touches them.
exclude: ^(tests/fixtures|docs/examples|docs/_static/brand)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # actionlint checks `run:` scripts with shellcheck when it finds one; bring our own so it
        # checks the same everywhere.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy (warnings are errors)
        language: system
        entry: cargo clippy --all-targets --locked -- -D warnings
        types: [rust]
        pass_filenames: false

      - id: pyright
        name: pyright (strict; settings in pyproject.toml)
        language: node
        # https://github.com/microsoft/pyright
        additional_dependencies: ["pyright@1.1.414"]
        entry: pyright
        types: [python]
        pass_filenames: false

      # The VS Code extension. These run its own pinned tools (typed linting needs its
      # node_modules), so run `npm ci --prefix editors/vscode` first; the wrapper says so if not.
      - id: vscode-prettier
        name: prettier (VS Code extension)
        language: system
        entry: editors/vscode/scripts/hook.sh prettier --write --ignore-unknown --
        files: ^editors/vscode/

      - id: vscode-eslint
        name: eslint (VS Code extension, type-aware strict)
        language: system
        entry: editors/vscode/scripts/hook.sh eslint --max-warnings 0 --no-warn-ignored --
        files: ^editors/vscode/.*\.(ts|mjs)$

      - id: vscode-tsc
        name: tsc --noEmit (VS Code extension, strict)
        language: system
        entry: editors/vscode/scripts/hook.sh tsc --noEmit -p .
        files: ^editors/vscode/(.*\.ts|tsconfig\.json|package-lock\.json)$
        pass_filenames: false
